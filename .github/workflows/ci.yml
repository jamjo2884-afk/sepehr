name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — faster feedback, less quota burn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Repo has package-lock.json → npm ci (reproducible install).
      - name: Install dependencies
        run: npm ci

      # Build script runs `prisma generate`; typecheck/lint/tests import the
      # generated client, so generate it up front.
      # prisma.config.ts requires DATABASE_URL to be present (env() throws when
      # missing) even though `generate` never connects to the database — a
      # syntactically valid placeholder keeps CI green.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
